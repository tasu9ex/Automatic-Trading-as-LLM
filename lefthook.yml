pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    knip:
      glob: "src/**/*"
      run: pnpm knip
    db-check:
      glob: "drizzle/migrations/**"
      run: pnpm db:check
    test:
      glob: "*.{ts,tsx}"
      run: pnpm vitest run --passWithNoTests

# 重い検証は push 直前に集約。
# build はサーバーコンポーネント・CSS パイプライン等、typecheck では拾えない問題を検出。
pre-push:
  parallel: false
  commands:
    build:
      glob: "*"
      run: pnpm build
